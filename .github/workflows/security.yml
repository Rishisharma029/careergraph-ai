name: CareerGraph AI — Security CI/CD Pipeline
# Modelled after GitHub, Stripe, and OpenAI DevSecOps practices.
# Runs on every PR and push to main. ALL checks must pass before merge.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ───────────────────────────────────────────────
  # 1. Secret Scanning
  # Detects hardcoded API keys, tokens, passwords
  # ───────────────────────────────────────────────
  secret-scan:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks — Detect hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────
  # 2. Dependency Vulnerability Audit
  # ───────────────────────────────────────────────
  dependency-audit:
    name: 📦 Dependency Audit (npm audit + Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high severity only)
        run: npm audit --audit-level=high
      - name: Snyk dependency vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ───────────────────────────────────────────────
  # 3. SAST — Static Analysis Security Testing
  # ───────────────────────────────────────────────
  sast:
    name: 🔬 SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  # ───────────────────────────────────────────────
  # 4. OWASP Dependency Check
  # ───────────────────────────────────────────────
  owasp-check:
    name: 🛡️ OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: careergraph-ai
          path: '.'
          format: 'SARIF'
          args: --failOnCVSS 7 --enableRetired
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

  # ───────────────────────────────────────────────
  # 5. TypeScript Type Check + Lint
  # ───────────────────────────────────────────────
  type-check:
    name: 🧪 TypeScript + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint security rules
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  # ───────────────────────────────────────────────
  # 6. Production Build Verification
  # ───────────────────────────────────────────────
  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ───────────────────────────────────────────────
  # 7. Docker Image Security Scan (Trivy)
  # ───────────────────────────────────────────────
  container-scan:
    name: 🐳 Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t careergraph-ai:${{ github.sha }} .
      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: careergraph-ai:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ───────────────────────────────────────────────
  # 8. PR Security Summary
  # ───────────────────────────────────────────────
  pr-summary:
    name: 📋 PR Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, sast, type-check, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Post security summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🛡️ Security Pipeline Results\n\n| Check | Status |\n|---|---|\n| 🔑 Secret Scanning | ✅ Passed |\n| 📦 Dependency Audit | ✅ Passed |\n| 🔬 SAST (CodeQL) | ✅ Passed |\n| 🧪 TypeScript Check | ✅ Passed |\n| 🏗️ Production Build | ✅ Passed |\n\nAll security gates passed. Safe to merge.`
            })
