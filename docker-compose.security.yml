version: '3.9'

# CareerGraph AI — Full Security Stack
# Production-grade container architecture with:
#   - TLS termination (Nginx)
#   - JWT auth (FastAPI)
#   - Encrypted vector store (Qdrant)
#   - Knowledge graph (Neo4j with auth)
#   - Rate limiting (Redis + slowapi)
#   - Virus scanning (ClamAV)
#   - PostgreSQL audit log store

networks:
  careergraph-internal:
    driver: bridge
    internal: true      # No external access from app containers
  careergraph-edge:
    driver: bridge      # Only nginx sits here

volumes:
  postgres-data:
  neo4j-data:
  qdrant-data:
  redis-data:
  clamav-db:

services:
  # ─────────────────────────────────────
  # 1. Nginx TLS Reverse Proxy (Edge)
  # ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./dist:/var/www/html:ro
    networks:
      - careergraph-edge
      - careergraph-internal
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────
  # 2. FastAPI Backend
  # ─────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://careergraph:${DB_PASSWORD}@postgres:5432/careergraph
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    secrets:
      - jwt_private_key
      - jwt_public_key
    networks:
      - careergraph-internal
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis
      - clamav
    restart: unless-stopped
    read_only: true          # Container filesystem is read-only
    tmpfs:
      - /tmp                 # Only /tmp is writable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                  # Drop all Linux capabilities
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────
  # 3. PostgreSQL — Audit + User Store
  # ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careergraph
      POSTGRES_USER: careergraph
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - careergraph-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergraph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # 4. Neo4j — Knowledge Graph
  # ─────────────────────────────────────
  neo4j:
    image: neo4j:5.19-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
    volumes:
      - neo4j-data:/data
    networks:
      - careergraph-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────
  # 5. Qdrant — Vector Embeddings
  # ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.4
    volumes:
      - qdrant-data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - careergraph-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────
  # 6. Redis — Rate Limiting + Cache
  # ─────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - careergraph-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # 7. ClamAV — Virus Scanning
  # ─────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - careergraph-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s  # ClamAV needs time to load virus definitions

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  db_password:
    file: ./secrets/db_password.txt
